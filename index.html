<html>
    <head>
        <meta charset="utf-8">
        <title>
            Animated Text Disappear
        </title>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Poppins&display=swap');

            body{
                    background-color: black;
                        height: 100vh;
                            font-family: 'Poppins' sans-serif;
                                font-size: 12vw;
                                    text-transform: uppercase;
                                        overflow: hidden;
            }
                .ILOVEYOUM{
                        position: absolute;
                            left: 0;
                                right: 0;
                                    margin: auto;
                                        width: 100%;
                                            text-align: center;
                                                height: fit-content;
                                                    bottom: 0;
                                                        top: 0;
                }
                    .ILOVEYOUM span{
                            display: inline-block;
                                color: transparent;
                                    text-shadow: 0px 0px 0px rgb(255, 255, 255);
                                        animation-duration: 3s;
                                            animation-iteration-count: infinite;
                    }
                        .ILOVEYOUM span:nth-child(1)
                            {
                                    animation-name: ILOVEYOUMleft;
                            }


                                .ILOVEYOUM span:nth-child(2)
                                    {
                                            animation-name: ILOVEYOUMleft;
                                                animation-delay: .3s;
                                    }

                                        .ILOVEYOUM span:nth-child(2)
                                            {
                                                    animation-name: ILOVEYOUMleft;
                                                        animation-delay: .3s;
                                            }

                                                .ILOVEYOUM span:nth-child(3)
                                                    {
                                                            animation-name: ILOVEYOUMleft;
                                                                animation-delay: .6s;
                                                    }

                                                        .ILOVEYOUM span:nth-child(4)
                                                            {
                                                                    animation-name: ILOVEYOUMight;
                                                                        animation-delay: .8s;
                                                            }

                                                                .ILOVEYOUM span:nth-child(5)
                                                                    {
                                                                            animation-name:ILOVEYOUMright;
                                                                                animation-delay: 1s;
                                                                    }

                                                                        .ILOVEYOUM span:nth-child(6)
                                                                            {
                                                                                    animation-name: ILOVEYOUMright;
                                                                                        animation-delay: 1.3s;
                                                                            }


                                                                                .ILOVEYOUM span:nth-child(7)
                                                                                    {
                                                                                            animation-name: ILOVEYOUMleft;
                                                                                                animation-delay: 1.6s;
                                                                                    }

                                                                                        .ILOVEYOUM span:nth-child(8)
                                                                                            {
                                                                                                    animation-name: ILOVEYOUMright;
                                                                                                        animation-delay: 2s;
                                                                                            }

                                                                                                .ILOVEYOUM span:nth-child(9)
                                                                                                    {
                                                                                                            animation-name: ILOVEYOUMright;
                                                                                                                animation-delay: 2.3s;
                                                                                                    }



                                                                                                        @keyframes ILOVEYOUMleft{
                                                                                                                50%{
                                                                                                                        transform: skew(50deg) translateY(-200%);
                                                                                                                            text-shadow: 0px 0px 50px;
                                                                                                                                opacity: 0;
                                                                                                                }
                                                                                                            }


                                                                                                                @keyframes ILOVEYOUMright{
                                                                                                                        50%{
                                                                                                                                transform: skew(-50deg) translateY(-200%);
                                                                                                                                    text-shadow: 0px 0px 50px;
                                                                                                                                        opacity: 0;
                                                                                                                        }
                                                                                                                    }


                                                                                                                        </style>
                                                                                                                            </head>
                                                                                                                                <body>

                                                                                                                                        <div class="ILOVEYOUM">
                                                                                                                                                <span>I</span>
                                                                                                                                                    <span>L</span>
                                                                                                                                                        <span>O</span>
                                                                                                                                                            <span>V</span>
                                                                                                                                                                <span>E</span>
                                                                                                                                                                    <span>Y</span>
                                                                                                                                                                        <span>O</span>
                                                                                                                                                                            <span>U</span>
                                                                                                                                                                                <span>M</span>
                                                                                                                                        </div>

                                                                                                                                    </body>
                                                                                                                                        </html>
                                                                                                                                        
                                                                                                                        }
                                                                                                                }
                                                                                                                }
                                                                                                        }
                                                                                                    }
                                                                                            }
                                                                                    }
                                                                            }
                                                                    }
                                                            }
                                                    }
                                            }
                                    }
                            }
                    }
                }
            }
